# Official artifact recipes. Composition is data, not CLI flags.
# `omc build <id>` is the only path that may publish under these identities.
# Custom `omc build CH --source ...` is local/experimental and cannot be published
# as ch-base or ch-enriched.
schemaVersion: "1"
artifacts:
  ch-base:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-enriched:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
      - refdata
      # bag is added only after redistribution terms are recorded.
    attachRawSources:
      - swissmedic
    # 2026-08 regression: every release shipped 18,309 packages with 0 GTINs
    # because the Refdata join silently matched nothing. Refdata is a
    # voluntary registration database: measured coverage on the 2026-08
    # snapshot is 79.7% of HAM packs (80% of active ones; revoked packs are
    # never registered). The floor catches a broken join, not registration
    # drift — leave room below the measured value.
    qualityGates:
      minPercentPackagesWithGtin: 65
  ch-vet-base:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-vet-enriched:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
      - refdata
    attachRawSources:
      - swissmedic
    # TAM registration is lower than HAM: measured 61.8% of TAM packs on the
    # 2026-08 snapshot. Same rationale as ch-enriched: catch a broken join,
    # tolerate registration drift.
    qualityGates:
      minPercentPackagesWithGtin: 50
  fr-base:
    jurisdiction: FR
    domain: Human
    requiredSources:
      - bdpm
    attachRawSources:
      - bdpm
    # CIP13 is a GTIN; observed coverage is 100%.
    qualityGates:
      minPercentPackagesWithGtin: 90
  fr-enriched:
    jurisdiction: FR
    domain: Human
    requiredSources:
      - bdpm
      - openmedic
    attachRawSources:
      - bdpm
    # ATC comes from Open Medic (ANSM removed CIS_ATC_bdpm.txt from the
    # public BDM v4 file set). Open Medic covers reimbursed city-delivered
    # medicines only — measured ~61% of products on the 2025 edition — so
    # the floor catches a zero-match join, not partial coverage.
    qualityGates:
      minPercentPackagesWithGtin: 90
      minPercentProductsWithAtc: 50
  pl-base:
    jurisdiction: PL
    domain: Human
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
    # RPL carries no GTIN for ~10% of packs (verified against the live
    # register); the floor leaves drift room below the observed ~90%.
    qualityGates:
      minPercentPackagesWithGtin: 80
  pl-vet-base:
    jurisdiction: PL
    domain: Veterinary
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
    qualityGates:
      minPercentPackagesWithGtin: 80
  us-base:
    jurisdiction: US
    domain: Human
    requiredSources:
      - ndc
    attachRawSources:
      - ndc
  # Future (not this delivery):
  # global-base:
  #   requiredArtifacts: [ch-base, fr-base, pl-base, no-base, ca-base, us-base]
