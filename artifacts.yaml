# Official artifact recipes. Composition is data, not CLI flags.
# `omc build <id>` is the only path that may publish under these identities.
# Custom `omc build CH --source ...` is local/experimental and cannot be published
# as ch-base or ch-enriched.
schemaVersion: "1"
artifacts:
  ch-base:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-enriched:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
      - refdata
      # bag is added only after redistribution terms are recorded.
    attachRawSources:
      - swissmedic
    # 2026-08 regression: every release shipped 18,309 packages with 0 GTINs
    # because the Refdata join silently matched nothing. Floors leave room for
    # real source coverage (Refdata misses only GTIN-less packs, e.g. blood
    # products) while making a zero-match join fail the official build.
    qualityGates:
      minPercentPackagesWithGtin: 70
  ch-vet-base:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-vet-enriched:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
      - refdata
    attachRawSources:
      - swissmedic
    qualityGates:
      minPercentPackagesWithGtin: 70
  fr-base:
    jurisdiction: FR
    domain: Human
    requiredSources:
      - bdpm
    attachRawSources:
      - bdpm
    # CIP13 is a GTIN; observed coverage is 100%.
    qualityGates:
      minPercentPackagesWithGtin: 90
  pl-base:
    jurisdiction: PL
    domain: Human
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
    # RPL carries no GTIN for ~10% of packs (verified against the live
    # register); the floor leaves drift room below the observed ~90%.
    qualityGates:
      minPercentPackagesWithGtin: 80
  pl-vet-base:
    jurisdiction: PL
    domain: Veterinary
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
    qualityGates:
      minPercentPackagesWithGtin: 80
  us-base:
    jurisdiction: US
    domain: Human
    requiredSources:
      - ndc
    attachRawSources:
      - ndc
  # Future (not this delivery):
  # global-base:
  #   requiredArtifacts: [ch-base, fr-base, pl-base, no-base, ca-base, us-base]
