# Official artifact recipes. Composition is data, not CLI flags.
# `omc build <id>` is the only path that may publish under these identities.
# Custom `omc build CH --source ...` is local/experimental and cannot be published
# as ch-base or ch-enriched.
schemaVersion: "1"
artifacts:
  ch-base:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-enriched:
    jurisdiction: CH
    domain: Human
    requiredSources:
      - swissmedic
      - refdata
      # bag is added only after redistribution terms are recorded.
    attachRawSources:
      - swissmedic
  ch-vet-base:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
    attachRawSources:
      - swissmedic
  ch-vet-enriched:
    jurisdiction: CH
    domain: Veterinary
    requiredSources:
      - swissmedic
      - refdata
    attachRawSources:
      - swissmedic
  fr-base:
    jurisdiction: FR
    domain: Human
    requiredSources:
      - bdpm
    attachRawSources:
      - bdpm
  pl-base:
    jurisdiction: PL
    domain: Human
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
  pl-vet-base:
    jurisdiction: PL
    domain: Veterinary
    requiredSources:
      - rpl
    attachRawSources:
      - rpl
  us-base:
    jurisdiction: US
    domain: Human
    requiredSources:
      - ndc
    attachRawSources:
      - ndc
  # Future (not this delivery):
  # global-base:
  #   requiredArtifacts: [ch-base, fr-base, pl-base, no-base, ca-base, us-base]
