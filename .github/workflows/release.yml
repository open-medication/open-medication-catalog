name: release
on:
  schedule:
    # 1st and 15th, 07:00 UTC (~every other week)
    - cron: "0 7 1,15 * *"
  workflow_dispatch:
    inputs:
      artifact:
        description: "ch-base or ch-enriched"
        default: "ch-base"
      month:
        description: "YYYY.MM (default: newest unpublished Swissmedic archive)"
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.artifact || 'ch-base')) || fromJSON('["ch-base","ch-enriched"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Discover next unpublished month
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(pnpm omc next-month "${{ matrix.artifact }}" --github-output "$GITHUB_OUTPUT")
          MONTH="${{ github.event.inputs.month }}"
          if [ -n "$MONTH" ]; then ARGS+=(--month "$MONTH"); fi
          "${ARGS[@]}"
      - name: Rebuild native modules
        if: steps.next.outputs.skip != 'true'
        run: pnpm rebuild:native
      - uses: actions/setup-java@v4
        if: steps.next.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache HL7 validator
        if: steps.next.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: tooling/validator_cli.jar
          key: validator-cli-${{ hashFiles('tooling/pins.json') }}
      - name: Build artifact
        if: steps.next.outputs.skip != 'true'
        id: build
        env:
          REFDATA_API_KEY: ${{ secrets.REFDATA_API_KEY }}
        run: |
          LOG="${{ runner.temp }}/omc-build.log"
          set +e
          pnpm omc build ${{ matrix.artifact }} --month "${{ steps.next.outputs.month }}" --out "output/${{ matrix.artifact }}" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          set -e
          if grep -q "not yet available" "$LOG" || [ -f "output/${{ matrix.artifact }}/.not-yet-available" ]; then
            echo "not_yet=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Compile FHIR IGs
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        run: |
          pnpm exec sushi fhir/r4
          pnpm exec sushi fhir/r5
      - name: Java FHIR validate
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        run: pnpm omc fhir-validate --dir "output/${{ matrix.artifact }}/release" --max 25
      - name: Publish GitHub Release
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          ZIP=$(ls output/${{ matrix.artifact }}/*.zip 2>/dev/null | head -n 1)
          if [ ! -f "$ZIP" ]; then
            echo "No zip produced after a successful build"
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "output/${{ matrix.artifact }}/release/manifest.json" \
            --title "$TAG" \
            --notes "Open Medication Catalogue $TAG"

  catalog:
    needs: release
    if: always() && !cancelled()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
