name: release
on:
  schedule:
    # 1st and 15th, 07:00 UTC (~every other week)
    - cron: "0 7 1,15 * *"
  workflow_dispatch:
    inputs:
      artifact:
        description: "ch-base, ch-vet-base, ch-enriched, ch-vet-enriched, fr-base, fr-enriched, pl-base, pl-vet-base, or us-base"
        default: "ch-base"
      month:
        description: "YYYY.MM (default: newest unpublished month for that artifact)"
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.artifact || 'ch-base')) || fromJSON('["ch-base","ch-enriched","ch-vet-base","ch-vet-enriched","fr-base","fr-enriched","pl-base","pl-vet-base","us-base"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Discover next unpublished month
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(pnpm omc next-month "${{ matrix.artifact }}" --github-output "$GITHUB_OUTPUT")
          MONTH="${{ github.event.inputs.month }}"
          if [ -n "$MONTH" ]; then ARGS+=(--month "$MONTH"); fi
          "${ARGS[@]}"
      - name: Rebuild native modules
        if: steps.next.outputs.skip != 'true'
        run: pnpm rebuild:native
      - name: Fetch previous release baseline
        # Quality gates compare against the last published quality report
        # (package-count regressions, "all GTINs disappeared").
        if: steps.next.outputs.skip != 'true'
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART="${{ matrix.artifact }}"
          TAG="${{ steps.next.outputs.tag }}"
          PREV_TAG=$(gh release list --limit 300 | awk -v p="^${ART}-" -v cur="^${TAG}\$" '$1 ~ p && $1 !~ cur {print $1; exit}')
          if [ -n "$PREV_TAG" ]; then
            echo "Previous release: $PREV_TAG"
            rm -rf previous && mkdir -p previous/release
            gh release download "$PREV_TAG" --pattern "*.zip" --dir previous/zip
            unzip -q previous/zip/*.zip -d previous/extract
            cp previous/extract/quality-report.json previous/release/quality-report.json
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "No previous release for ${ART}"
          fi
      - uses: actions/setup-java@v4
        if: steps.next.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache HL7 validator
        if: steps.next.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: tooling/validator_cli.jar
          key: validator-cli-${{ hashFiles('tooling/pins.json') }}
      - name: Build artifact
        if: steps.next.outputs.skip != 'true'
        id: build
        env:
          REFDATA_API_KEY: ${{ secrets.REFDATA_API_KEY }}
        run: |
          LOG="${{ runner.temp }}/omc-build.log"
          ARGS=(pnpm omc build ${{ matrix.artifact }} --month "${{ steps.next.outputs.month }}" --out "output/${{ matrix.artifact }}")
          if [ "${{ steps.prev.outputs.has_previous }}" = "true" ]; then
            ARGS+=(--previous previous)
          fi
          set +e
          "${ARGS[@]}" 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          set -e
          if grep -q "not yet available" "$LOG" || [ -f "output/${{ matrix.artifact }}/.not-yet-available" ]; then
            echo "not_yet=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Compile FHIR IGs
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        run: |
          pnpm exec sushi fhir/r4
          pnpm exec sushi fhir/r5
      - name: Java FHIR validate
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        run: pnpm omc fhir-validate --dir "output/${{ matrix.artifact }}/release"
      - name: Smoke test release contents
        # Independent of the in-process gates: verify the artifact we are
        # about to publish actually contains the data it must carry.
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        run: |
          ZIP=$(ls output/${{ matrix.artifact }}/*.zip | head -n 1)
          rm -rf smoke && mkdir smoke && unzip -q "$ZIP" -d smoke
          TOTAL=$(sqlite3 smoke/database/medication.sqlite "SELECT COUNT(*) FROM package")
          WITHGTIN=$(sqlite3 smoke/database/medication.sqlite "SELECT COUNT(gtin) FROM package")
          echo "packages=$TOTAL with_gtin=$WITHGTIN"
          case "${{ matrix.artifact }}" in
            ch-enriched|ch-vet-enriched|fr-base|fr-enriched|pl-base|pl-vet-base)
              if [ "${TOTAL:-0}" -gt 0 ]; then
                PCT=$(( WITHGTIN * 100 / TOTAL ))
                echo "GTIN coverage: ${PCT}%"
                # Coarse backstop only; the per-recipe floors in artifacts.yaml
                # carry the precise gates (Refdata is a voluntary registry:
                # measured 79.7% HAM / 61.8% TAM on 2026-08).
                if [ "$PCT" -lt 50 ]; then
                  echo "::error::GTIN coverage ${PCT}% is below the 50% backstop"
                  exit 1
                fi
              fi
              ;;
            *)
              echo "No GTIN floor for this artifact (source carries none by design)"
              ;;
          esac
      - name: Publish GitHub Release
        if: steps.next.outputs.skip != 'true' && steps.build.outputs.not_yet != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          ZIP=$(ls output/${{ matrix.artifact }}/*.zip 2>/dev/null | head -n 1)
          if [ ! -f "$ZIP" ]; then
            echo "No zip produced after a successful build"
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "output/${{ matrix.artifact }}/release/manifest.json" \
            --title "$TAG" \
            --notes "Open Medication Catalogue $TAG"

  # After the whole matrix (schedule) or the single dispatched artifact — not
  # per matrix cell. Pages publishes are serialized in pages.yml so a second
  # overlapping release run cannot clobber catalog.json on gh-pages.
  catalog:
    needs: release
    if: always() && !cancelled()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
      pages: write
      id-token: write
