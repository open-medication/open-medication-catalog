name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

# One writer at a time to gh-pages. Overlapping release dispatches each call
# this workflow; without a mutex the later force-push can drop artifacts the
# other run already published. Queue (don't cancel) so the last deploy rebuilds
# catalog.json from every GitHub Release after the previous publish finishes.
# Also serializes scheduled release.yml vs a concurrent workflow_dispatch.
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Rebuild catalog.json from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm omc catalog --write site/public/catalog.json
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Build landing page
        working-directory: site
        run: pnpm build
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          cname: openmedicationcatalog.org
