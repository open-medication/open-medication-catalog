  notes: "The workbook this adapter reads is the SFDA human drug list hosted on the CHI Drug Formulary page, so CHI portal terms apply to that copy. terms.url is the terms of use: only personal and a public or commercial derived work needs prior written consent. terms.datasetUrl is the formulary page. The CHI privacy policy and the Policies tab are not dataset licences. The CHI open-data page does not list this workbook. A data-sharing request is not itself a grant. The only permitted use still requires naming the CHI Portal. Adapter is local --source sfda only; no public recipe. A later file taken from sfda.gov.sa needs its own review; do not carry this review-required reading, or a CHI consent, across to that host."
